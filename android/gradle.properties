org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
android.useAndroidX=true

# Play application id. Also set the same value in:
#   public/.well-known/assetlinks.json  (package_name)
#   android/twa-manifest.json            (packageId)
# The Java package app.refundsbag can stay put if only APP_ID changes.
APP_ID=app.refundsbag
APP_HOST=justrefundme.netlify.app
APP_START_PATH=/dashboard
APP_NAME=Refunds Bag
APP_LAUNCHER_NAME=Refunds Bag
APP_VERSION_CODE=1
APP_VERSION_NAME=1.0.0
APP_THEME_COLOR=#f6f1e4
APP_THEME_COLOR_DARK=#f6f1e4
APP_NAV_COLOR=#f6f1e4
APP_NAV_COLOR_DARK=#f6f1e4
APP_NAV_DIVIDER=#00000000
APP_NAV_DIVIDER_DARK=#00000000
APP_BACKGROUND_COLOR=#f6f1e4
